name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opticapp
          POSTGRES_PASSWORD: opticapp
          POSTGRES_DB: opticapp_test
        ports:
          - 5432:5432
        # Sin el healthcheck, los tests arrancan antes de que Postgres acepte
        # conexiones y fallan de forma intermitente.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://opticapp:opticapp@localhost:5432/opticapp_test
      JWT_SECRET: secreto-solo-para-ci
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npx tsc --noEmit

      # `npm run build` ya corre tsc antes de vite build, pero se deja el paso
      # anterior por separado para que un error de tipos se vea como tal y no
      # mezclado con la salida del bundler.
      - name: Build
        run: npm run build
