services:
  # Backend - Web Service
  - type: web
    name: opticapp-backend
    env: node
    region: oregon
    plan: free
    buildCommand: npm install --include=dev && cd frontend && npm install --include=dev && npm run build && cd .. && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_EMAIL
        value: opticappuy@gmail.com
      # Envío de emails: configurar SMTP_* (casilla de Gmail) o RESEND_API_KEY.
      # Si no hay ninguno, la app arranca igual y solo no manda notificaciones.
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: APP_URL
        value: https://opticapp.onrender.com
      # Base de datos: Supabase (Postgres). Configurar manualmente en el
      # dashboard de Render con el connection string en modo "Session pooler"
      # de Supabase (Settings > Database > Connection string).
      - key: DATABASE_URL
        sync: false

